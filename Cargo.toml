[package]
name = "GUI"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[[bin]]
name = "gui"
path = "src/bin/gui.rs"

[[bin]]
name = "pcap"
path = "src/bin/pcap.rs"

[[bench]]
name = "bench"
path = "src/bin/bench.rs" # file: benches/parse.rs
harness = false

[profile.release]
debug = true

[lib]
name = "shared"
path = "src/lib.rs"

[dependencies]
gpui = { path = "../../Lib/zed/crates/gpui" }
analyzer = { path = "./analyzer"}
gpui_platform = { path  = "../../Lib/zed/crates/gpui_platform" , features = ["font-kit", "wayland", "x11"] }
rtshark = "4.3.0"
criterion = "0.8.2"
pcap-parser = "0.17.0"
# pcap-parser = "0.17.0"
#
[dev.dependencies]
criterion = "0.8.2"


[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
